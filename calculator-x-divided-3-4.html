<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Exposure Calculator</title>

<style>
body{
    font-family:Arial,sans-serif;
    background:#f2f4f7;
    margin:0;
    min-height:100vh;
    display:grid;
    place-items:center;
    color:#1f2937;
}

.card{
    width:min(90vw,420px);
    background:white;
    padding:28px;
    border-radius:16px;
    box-shadow:0 10px 30px rgba(0,0,0,0.12);
}

h1{
    text-align:center;
    font-size:1.5rem;
    margin-top:0;
    margin-bottom:22px;
}

.mode{
    margin-bottom:22px;
    padding-bottom:22px;
    border-bottom:1px solid #e5e7eb;
}

.mode:last-of-type{
    border-bottom:none;
}

h2{
    font-size:1.1rem;
    margin-bottom:12px;
}

label{
    display:block;
    margin-bottom:8px;
    font-weight:bold;
}

input{
    width:100%;
    box-sizing:border-box;
    padding:12px;
    font-size:1.1rem;
    border:1px solid #cbd5e1;
    border-radius:10px;
}

button{
    width:100%;
    margin-top:14px;
    padding:12px;
    border:0;
    border-radius:10px;
    font-size:1rem;
    cursor:pointer;
    background:#2563eb;
    color:white;
}

button:hover{
    background:#1d4ed8;
}

.result{
    margin-top:14px;
    padding:14px;
    min-height:24px;
    border-radius:10px;
    background:#eef2ff;
    font-size:1.1rem;
    text-align:center;
    font-weight:bold;
}

.formula{
    text-align:center;
    color:#64748b;
    font-size:0.95rem;
    margin-bottom:12px;
}
</style>
</head>

<body>

<main class="card">

<h1>Exposure Calculator</h1>

<section class="mode">

    <h2>Calculate Energy</h2>

    <div class="formula">
        Y = 3400 ÷ X
    </div>

    <label for="inputX">Enter X</label>

    <input
        id="inputX"
        type="text"
        inputmode="decimal"
        placeholder="Example: 20"
    >

    <button id="calculateY" type="button">
        Calculate Energy
    </button>

    <div id="resultY" class="result">
        Result will appear here
    </div>

</section>


<section class="mode">

    <h2>Calculate X</h2>

    <div class="formula">
        X = 3400 ÷ Y
    </div>

    <label for="inputY">
        Enter desired energy (mJ/cm²)
    </label>

    <input
        id="inputY"
        type="text"
        inputmode="decimal"
        placeholder="Example: 170"
    >

    <button id="calculateX" type="button">
        Calculate X
    </button>

    <div id="resultX" class="result">
        Result will appear here
    </div>

</section>

</main>


<script>

function readNumber(value){
    const normalized = value.trim().replace(",", ".");
    const number = Number(normalized);

    if(!normalized || !Number.isFinite(number)){
        return null;
    }

    return number;
}


document
    .getElementById("calculateY")
    .addEventListener("click", () => {

        const x = readNumber(
            document.getElementById("inputX").value
        );

        const result = document.getElementById("resultY");

        if(x === null){
            result.textContent = "Please enter a valid number.";
            return;
        }

        if(x === 0){
            result.textContent = "X cannot be zero.";
            return;
        }

        const y = 3400 / x;

        result.textContent =
            `${y.toLocaleString(
                undefined,
                {maximumFractionDigits:8}
            )} mJ/cm²`;
    });


document
    .getElementById("calculateX")
    .addEventListener("click", () => {

        const y = readNumber(
            document.getElementById("inputY").value
        );

        const result = document.getElementById("resultX");

        if(y === null){
            result.textContent = "Please enter a valid number.";
            return;
        }

        if(y === 0){
            result.textContent = "Energy cannot be zero.";
            return;
        }

        const x = 3400 / y;

        result.textContent =
            x.toLocaleString(
                undefined,
                {maximumFractionDigits:8}
            );
    });

</script>

</body>
</html>
